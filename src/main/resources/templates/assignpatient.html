<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assign Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/doctorDashboard.css}">
</head>

<body>
<div class="layout">

    <!-- ════════════ SIDEBAR ════════════ -->
    <aside th:replace="~{fragments/sidebar/doctor-sidebar :: sidebar('assign', ${doctor})}"></aside>

    <!-- ════════════ MAIN ════════════ -->
    <main class="main">

        <div class="page-header">
            <span class="greeting">Unassigned patients available</span>
            <h2>Assign Patient</h2>
        </div>

        <!-- Search Bar -->
            <div class="appt-search-wrap">
                <form th:action="@{/doctor/myPatient}" method="get"
                    style="display:flex; gap:10px; flex:1; align-items:center;">
                    <input type="hidden" name="pageNo" value="0">
                    <input type="hidden" name="pageSize" th:value="${pageSize}">
                    <div class="appt-search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" name="searchQuery" th:value="${searchQuery}"
                            placeholder="Search by name or ID...">
                    </div>
                    <button type="submit" class="appt-search-btn">
                        <i class="fa-solid fa-magnifying-glass"></i> Search
                    </button>
                    <a th:href="@{/doctor/myPatient}" class="appt-reset-btn" style="text-decoration:none;">
                        <i class="fa-solid fa-rotate-left"></i> Reset
                    </a>
                </form>
            </div>

        <!-- Patient Table -->
        <div class="data-table-wrap">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Patient ID</th>
                        <th>Patient Name</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${patientList == null or patientList.isEmpty()}">
                        <td colspan="4" class="empty-row">No unassigned patients found.</td>
                    </tr>
                    <tr th:each="patient, patientStat : ${patientList}">
                        <td th:text="${startIndex + patientStat.index + 1}">1</td>
                        <td th:text="${patient.userId}">ID</td>
                        <td th:text="${patient.name}">Name</td>
                        <td>
                            <form th:action="@{/assignpatient/assigntoDoctor}" method="post"
                                  th:id="'assignForm-' + ${patientStat.index}" style="display:inline;">
                                <input type="hidden" name="patientId" th:value="${patient.userId}">
                                <button type="button" class="action-btn green confirm-assign-btn"
                                        th:data-form-id="'assignForm-' + ${patientStat.index}"
                                        th:data-patient-name="${patient.name}">
                                    <i class="fa-solid fa-user-plus"></i> Assign
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-bar">
            <a class="page-btn"
               th:classappend="${currentPage == 0} ? 'disabled'"
               th:href="@{/assignpatient(pageNo=${currentPage - 1}, pageSize=${pageSize}, searchQuery=${searchQuery})}">
               &laquo; Prev
            </a>
            <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
               class="page-btn"
               th:classappend="${i == currentPage} ? 'active'"
               th:href="@{/assignpatient(pageNo=${i}, pageSize=${pageSize}, searchQuery=${searchQuery})}"
               th:text="${i + 1}">1</a>
            <a class="page-btn"
               th:classappend="${currentPage + 1 == totalPages} ? 'disabled'"
               th:href="@{/assignpatient(pageNo=${currentPage + 1}, pageSize=${pageSize}, searchQuery=${searchQuery})}">
               Next &raquo;
            </a>
        </div>

    </main>
</div>

<!-- ════════════ CONFIRMATION MODAL ════════════ -->
<div id="confirmModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon" style="background: #eafaf3;">
            <i class="fa-solid fa-user-plus" style="color: var(--success); font-size: 22px;"></i>
        </div>
        <h5 id="modalTitle" class="modal-title">Assign Patient?</h5>
        <p id="modalMessage" class="modal-message">This patient will be assigned to you.</p>
        <div class="modal-actions">
            <button onclick="closeModal()" class="modal-btn-cancel">Cancel</button>
            <button id="modalConfirmBtn" class="modal-btn-confirm green">
                <i class="fa-solid fa-check"></i> Yes, Assign
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var targetFormId = null;

    document.querySelectorAll('.confirm-assign-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            targetFormId = this.getAttribute('data-form-id');
            var patientName = this.getAttribute('data-patient-name');

            document.getElementById('modalTitle').innerText = 'Assign ' + patientName + '?';
            document.getElementById('modalMessage').innerText = patientName + ' will be assigned to you as your patient.';
            document.getElementById('confirmModal').style.display = 'flex';
        });
    });

    function closeModal() {
        document.getElementById('confirmModal').style.display = 'none';
        targetFormId = null;
    }

    document.getElementById('modalConfirmBtn').addEventListener('click', function() {
        if (targetFormId) {
            document.getElementById(targetFormId).submit();
        }
    });

    document.getElementById('confirmModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
</script>

</body>
</html>
