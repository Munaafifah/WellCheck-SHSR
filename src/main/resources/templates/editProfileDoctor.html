<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Profile - Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/doctorDashboard.css}">
</head>

<body>
<div class="layout">

    <!-- ════════════ SIDEBAR ════════════ -->
    <aside th:replace="~{fragments/sidebar/doctor-sidebar :: sidebar('editProfile', ${doctor})}"></aside>

    <!-- ════════════ MAIN ════════════ -->
    <main class="main">

        <div class="page-header" style="display:flex; align-items:center; gap:14px; margin-bottom:28px;">
            <a th:href="@{/doctor}" class="back-btn" title="Back to Dashboard">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="page-header-text">
                <div class="subtitle">Account Settings</div>
                <h2>Edit Profile</h2>
            </div>
        </div>

        <form th:object="${doctor}"
              th:action="@{/doctor/updateProfile/profile}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden" th:field="*{userId}" />
            <input type="hidden" th:field="*{role}" />
            <input type="hidden" th:field="*{hospital}" />
            <input type="hidden" th:field="*{position}" />

            <!-- Profile Picture Card -->
            <div class="profile-pic-card">
                <img class="current-avatar"
                     th:src="${doctor.profilePicture != null}
                             ? 'data:' + ${doctor.profilePictureType} + ';base64,' + ${doctor.profilePicture}
                             : '/image/img_avatar1.png'"
                     alt="Current Profile Picture"
                     id="avatarPreview" />
                <div class="avatar-info">
                    <h6>Profile Picture</h6>
                    <p>JPG, PNG or GIF. Max size 2MB.</p>
                    <label class="file-input-label">
                        <i class="fa-solid fa-upload"></i>
                        Choose Photo
                        <input type="file" name="profileImage" accept="image/*"
                               onchange="previewImage(this)">
                    </label>
                    <div class="file-name-display" id="fileName">No file chosen</div>
                </div>
            </div>

            <!-- Info Form Card -->
            <div class="form-card">
                <div class="form-card-header">
                    <i class="fa-solid fa-id-card"></i>
                    <span>Personal Information</span>
                </div>

                <div class="form-card-body">
                    <div class="form-grid">

                        <div class="form-group-edit">
                            <label class="form-label-custom">Full Name</label>
                            <input type="text" th:field="*{name}"
                                   class="form-control-custom"
                                   placeholder="Enter full name" required>
                        </div>

                        <div class="form-group-edit">
                            <label class="form-label-custom">Contact Number</label>
                            <input type="text" th:field="*{contact}"
                                   class="form-control-custom"
                                   placeholder="e.g. 012-3456789" required>
                            <div class="helper-text">Numbers and dashes only</div>
                        </div>

                        <div class="form-group-edit">
                            <label class="form-label-custom">Hospital</label>
                            <input type="text" th:value="${doctor.hospital}"
                                   class="form-control-custom" disabled>
                            <div class="helper-text">Contact admin to update</div>
                        </div>

                        <div class="form-group-edit">
                            <label class="form-label-custom">Position</label>
                            <input type="text" th:value="${doctor.position}"
                                   class="form-control-custom" disabled>
                            <div class="helper-text">Contact admin to update</div>
                        </div>

                    </div>
                </div>

                <div class="form-card-footer">
                    <a th:href="@{/doctor}" class="btn-outline-blue">
                        <i class="fa-solid fa-xmark"></i> Cancel
                    </a>
                    <button type="submit" class="btn-blue">
                        <i class="fa-solid fa-floppy-disk"></i> Save Changes
                    </button>
                </div>
            </div>

        </form>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function previewImage(input) {
        const fileName = document.getElementById('fileName');
        const preview  = document.getElementById('avatarPreview');
        if (input.files && input.files[0]) {
            fileName.textContent = input.files[0].name;
            const reader = new FileReader();
            reader.onload = e => preview.src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        } else {
            fileName.textContent = 'No file chosen';
        }
    }
</script>

</body>
</html>
