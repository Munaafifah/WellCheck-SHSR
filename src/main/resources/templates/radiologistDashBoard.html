<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radiologist Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/themes/theme-base.css}">
    <link rel="stylesheet" th:href="@{/css/themes/radiologist-theme.css}">
</head>

<body>
<div class="layout">

    <!-- ════════════ SIDEBAR ════════════ -->
    <aside th:replace="~{fragments/sidebar/radiologist-sidebar :: sidebar('dashboard', ${radiologist})}"></aside>

    <!-- ════════════ MAIN ════════════ -->
    <main class="main">

        <div class="page-header">
            <div class="subtitle">Welcome back</div>
            <h2 th:text="'Hello, Dr. ' + ${radiologist.name}">Hello, Radiologist</h2>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-microscope"></i></div>
                <div>
                    <div class="stat-value">—</div>
                    <div class="stat-label">Reports Today</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
                <div>
                    <div class="stat-value">—</div>
                    <div class="stat-label">Pending Reviews</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-hospital"></i></div>
                <div>
                    <div class="stat-value" th:text="${radiologist.department != null} ? ${radiologist.department} : '—'">—</div>
                    <div class="stat-label">Department</div>
                </div>
            </div>
        </div>

        <!-- Communication Quick Access -->
        <div class="info-card" style="display:flex; align-items:center; justify-content:space-between; padding: 20px 28px;">
            <div style="display:flex; align-items:center; gap:16px;">
                <div class="stat-icon">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <div>
                    <div style="font-weight:600; font-size:15px; color:var(--text-dark);">Communication Hub</div>
                    <div style="font-size:12px; color:var(--text-light); margin-top:3px;">Share imaging results &middot; Collaborate with Doctors &amp; Radiographers</div>
                </div>
            </div>
            <a th:href="@{/communication}"
               style="padding:10px 22px; background:var(--primary-500); color:#fff; border-radius:10px; text-decoration:none; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; white-space:nowrap;">
                <i class="fa-solid fa-comment-medical"></i> Open Chat
            </a>
        </div>

        <div class="info-card">
            <h5>Profile Information</h5>
            <div class="info-row">
                <span class="info-label">User ID</span>
                <span class="info-value" th:text="${radiologist.userId}">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Full Name</span>
                <span class="info-value" th:text="${radiologist.name}">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Email</span>
                <span class="info-value" th:text="${radiologist.email}">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Contact</span>
                <span class="info-value" th:text="${radiologist.contact}">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Department</span>
                <span class="info-value" th:text="${radiologist.department}">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Specialization</span>
                <span class="info-value" th:text="${radiologist.specialization}">—</span>
            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
