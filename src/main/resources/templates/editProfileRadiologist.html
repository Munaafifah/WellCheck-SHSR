<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Profile - Radiologist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/themes/theme-base.css}">
    <link rel="stylesheet" th:href="@{/css/themes/radiologist-theme.css}">
</head>

<body>
<div class="layout">

    <!-- ════════════ SIDEBAR ════════════ -->
    <aside th:replace="~{fragments/sidebar/radiologist-sidebar :: sidebar('editProfile', ${radiologist})}"></aside>

    <!-- ════════════ MAIN ════════════ -->
    <main class="main">
        <div class="page-header" style="display:flex; align-items:center; gap:14px; margin-bottom:28px;">
            <a th:href="@{/radiologist}" class="back-btn" title="Back to Dashboard">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="page-header-text">
                <div class="subtitle">Account Settings</div>
                <h2>Edit Profile</h2>
            </div>
        </div>

        <form th:object="${radiologist}" th:action="@{/radiologist/updateProfile/profile}" method="post" enctype="multipart/form-data">

            <input type="hidden" th:field="*{userId}" />

            <div class="profile-pic-card">
                <img class="current-avatar"
                     th:src="${radiologist.profilePicture} != null
                              ? 'data:' + ${radiologist.profilePictureType} + ';base64,' + ${radiologist.profilePicture}
                              : '/image/img_avatar1.png'"
                     alt="Current Profile Picture" id="avatarPreview" />
                <div class="avatar-info">
                    <h6>Profile Picture</h6>
                    <p>JPG, PNG or GIF. Max size 2MB.</p>
                    <label class="file-input-label">
                        <i class="fa-solid fa-upload"></i>
                        Choose Photo
                        <input type="file" name="imageFile" accept="image/*" onchange="previewImage(this)">
                    </label>
                    <div class="file-name-display" id="fileName">No file chosen</div>
                </div>
            </div>

            <div class="form-card">
                <div class="form-card-header">
                    <i class="fa-solid fa-id-card"></i>
                    <span>Personal Information</span>
                </div>
                <div class="form-card-body">
                    <div class="form-grid">
                        <div class="form-group-edit">
                            <label class="form-label-custom">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control-custom" placeholder="Enter full name" required>
                        </div>
                        <div class="form-group-edit">
                            <label class="form-label-custom">Contact Number</label>
                            <input type="text" th:field="*{contact}" class="form-control-custom" placeholder="e.g. 012-3456789" pattern="[0-9\-]+" required>
                        </div>
                        <div class="form-group-edit">
                            <label class="form-label-custom">Department</label>
                            <input type="text" th:field="*{department}" class="form-control-custom" placeholder="e.g. Radiology" required>
                        </div>
                        <div class="form-group-edit">
                            <label class="form-label-custom">Specialization</label>
                            <input type="text" th:field="*{specialization}" class="form-control-custom" placeholder="e.g. MRI, CT Scan" required>
                        </div>
                    </div>
                </div>
                <div class="form-card-footer">
                    <a th:href="@{/radiologist}" class="btn-outline-primary">
                        <i class="fa-solid fa-xmark"></i> Cancel
                    </a>
                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Save Changes
                    </button>
                </div>
            </div>

        </form>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function previewImage(input) {
        const fileName = document.getElementById('fileName');
        const preview = document.getElementById('avatarPreview');
        if (input.files && input.files[0]) {
            fileName.textContent = input.files[0].name;
            const reader = new FileReader();
            reader.onload = e => preview.src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        } else {
            fileName.textContent = 'No file chosen';
        }
    }
</script>
</body>
</html>
