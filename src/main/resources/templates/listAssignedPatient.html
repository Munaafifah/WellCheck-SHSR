<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>List of Assigned Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/doctorDashboard.css}">
    <!-- Tom Select — searchable dropdowns -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tom-select-theme.css}">
</head>

<body>
    <div class="layout">

        <!-- ════════════ SIDEBAR ════════════ -->
        <aside th:replace="~{fragments/sidebar/doctor-sidebar :: sidebar('list', ${doctor})}"></aside>

        <!-- ════════════ MAIN ════════════ -->
        <main class="main">

            <div class="page-header">
                <span class="greeting">Overview of all your patients</span>
                <h2>List of Assigned Patients</h2>
            </div>

            <!-- Search + Filter Bar -->
            <div class="appt-search-wrap">
                <form th:action="@{/patient/list}" method="get"
                    style="display:flex; gap:10px; flex:1; align-items:center;">
                    <input type="hidden" name="pageNo" value="0">
                    <input type="hidden" name="pageSize" th:value="${pageSize}">
                    <div class="appt-search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" name="searchQuery" th:value="${searchQuery}"
                            placeholder="Search by name, ID or email...">
                    </div>
                    <button type="submit" class="appt-search-btn">
                        <i class="fa-solid fa-magnifying-glass"></i> Search
                    </button>
                    <a th:href="@{/patient/list}" class="appt-reset-btn" style="text-decoration:none;">
                        <i class="fa-solid fa-rotate-left"></i> Reset
                    </a>
                </form>
                <select id="statusFilter" class="filter-select">
                    <option value="all">All Status</option>
                    <option value="Released">Released</option>
                    <option value="Under Surveillance">Under Surveillance</option>
                </select>
            </div>

            <!-- Patient Table -->
            <div class="data-table-wrap">
                <table class="data-table" id="patientTable">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Doctor</th>
                            <th>Patient ID</th>
                            <th>Patient Name</th>
                            <th>Email</th>
                            <th>Contact</th>
                            <th>Address</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="patientTableBody">
                        <tr th:if="${patientList == null or patientList.isEmpty()}">
                            <td colspan="8" class="empty-row">No assigned patients found.</td>
                        </tr>
                        <tr th:each="patient, iterStat : ${patientList}">
                            <td th:text="${startIndex + iterStat.index + 1}">1</td>
                            <td th:text="${doctor.name}">Doctor</td>
                            <td th:text="${patient.userId}">ID</td>
                            <td th:text="${patient.name}">Name</td>
                            <td th:text="${patient.email}">Email</td>
                            <td th:text="${patient.contact}">Contact</td>
                            <td th:text="${patient.address}">Address</td>
                            <td>
                                <span class="row-badge"
                                    th:classappend="${patient.status == 'Released'} ? 'badge-cancelled' : 'badge-approved'"
                                    th:text="${patient.status != null} ? ${patient.status} : 'Active'">Active</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination-bar">
                <a class="page-btn" th:classappend="${currentPage == 0} ? 'disabled'"
                    th:href="@{/patient/list(pageNo=${currentPage - 1}, pageSize=${pageSize}, searchQuery=${searchQuery})}">
                    &laquo; Prev
                </a>
                <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="page-btn"
                    th:classappend="${i == currentPage} ? 'active'"
                    th:href="@{/patient/list(pageNo=${i}, pageSize=${pageSize}, searchQuery=${searchQuery})}"
                    th:text="${i + 1}">1</a>
                <a class="page-btn" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'"
                    th:href="@{/patient/list(pageNo=${currentPage + 1}, pageSize=${pageSize}, searchQuery=${searchQuery})}">
                    Next &raquo;
                </a>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Client-side status filter only (search is server-side)
        document.getElementById('statusFilter').addEventListener('change', function () {
            var status = this.value.toLowerCase();
            var rows = document.querySelectorAll('#patientTableBody tr');

            rows.forEach(function (row) {
                var statusCell = row.querySelector('td:nth-child(8)');
                var statusText = statusCell ? statusCell.textContent.toLowerCase() : '';
                var matchStatus = status === 'all' || statusText.includes(status);
                row.style.display = matchStatus ? '' : 'none';
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('select').forEach(function(el) {
            new TomSelect(el, { allowEmptyOption: true, onInitialize: function() { this.wrapper.style.width = '100%'; } });
        });
    });
    </script>
</body>

</html>
