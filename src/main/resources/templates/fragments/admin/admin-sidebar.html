<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>

<!--
  Admin Sidebar Fragment — WellCheck Radiance
  Usage:
    <aside th:replace="~{fragments/admin/admin-sidebar :: sidebar('dashboard')}"></aside>

  activePage values:
    dashboard | adduser | assignSensor | sensorStatus |
    doctorSchedule | reports | analytics
-->
<aside th:fragment="sidebar(activePage)" class="sidebar">

    <div class="sidebar-brand">
        <div class="brand-label">WellCheck System</div>
        <h1>Admin <span>Control</span></h1>
    </div>

    <div class="profile-card">
        <div class="profile-avatar-icon"><i class="fa-solid fa-user-shield"></i></div>
        <div class="profile-info">
            <div class="name">Administrator</div>
            <span class="role-badge">Admin</span>
        </div>
    </div>

    <nav class="sidebar-nav">

        <div class="nav-section-label">Management</div>
        <a th:href="@{/admin}" class="nav-link-item"
           th:classappend="${activePage == 'dashboard'} ? ' active'">
            <i class="fa-solid fa-users"></i>
            User List
        </a>
        <a th:href="@{/admin/adduser}" class="nav-link-item"
           th:classappend="${activePage == 'adduser'} ? ' active'">
            <i class="fa-solid fa-user-plus"></i>
            Add User
        </a>

        <div class="nav-section-label">Sensor</div>
        <a th:href="@{/admin/assign-sensor}" class="nav-link-item"
           th:classappend="${activePage == 'assignSensor'} ? ' active'">
            <i class="fa-solid fa-microchip"></i>
            Assign Sensor
        </a>
        <a th:href="@{/admin/sensor-status}" class="nav-link-item"
           th:classappend="${activePage == 'sensorStatus'} ? ' active'">
            <i class="fa-solid fa-satellite-dish"></i>
            Sensor Status
        </a>

        <div class="nav-section-label">Doctor Schedule</div>
        <a th:href="@{/admin/doctor-schedule}" class="nav-link-item"
           th:classappend="${activePage == 'doctorSchedule'} ? ' active'">
            <i class="fa-solid fa-calendar-days"></i>
            Manage Schedule
        </a>

        <div class="nav-section-label">Radiology</div>
        <a th:href="@{/reports}" class="nav-link-item"
           th:classappend="${activePage == 'reports'} ? ' active'">
            <i class="fa-solid fa-file-medical-alt"></i>
            Report Management
        </a>

        <div class="nav-section-label">Analytics</div>
        <a th:href="@{/admin/analytics}" class="nav-link-item"
           th:classappend="${activePage == 'analytics'} ? ' active'">
            <i class="fa-solid fa-chart-line"></i>
            Analytics Dashboard
        </a>

    </nav>

    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post" th:hidden="true" name="logoutForm">
            <input type="submit" value="Logout" />
        </form>
        <a href="javascript: document.logoutForm.submit()" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </a>
    </div>

</aside>

</body>
</html>
