<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>

<!--
  Doctor Sidebar Fragment
  Usage: <aside th:replace="~{fragments/sidebar/doctor-sidebar :: sidebar('dashboard', ${doctor})}"></aside>
  activePage values: dashboard | patients | assign | list | prediction | appointments | imaging | reports | requestScheduling | communication | editProfile
-->
<aside th:fragment="sidebar(activePage, doctor)" class="sidebar">

    <div class="sidebar-brand">
        <div class="brand-label">WellCheck System</div>
        <h1>Doctor <span>Hub</span></h1>
    </div>

    <div class="profile-card">
        <img class="profile-avatar"
             th:src="${doctor != null and doctor.profilePicture != null}
                     ? 'data:' + ${doctor.profilePictureType} + ';base64,' + ${doctor.profilePicture}
                     : '/image/img_avatar1.png'"
             alt="Profile Picture" />
        <div class="profile-info">
            <div class="name" th:text="${doctor != null} ? ${doctor.name} : 'Doctor'">Doctor</div>
            <span class="role-badge"
                  th:text="${doctor != null and doctor.position != null} ? ${doctor.position} : 'Doctor'">Doctor</span>
        </div>
    </div>

    <nav class="sidebar-nav">

        <div class="nav-section-label">Main Menu</div>

        <a th:href="@{/doctor}"
           class="nav-link-item"
           th:classappend="${activePage == 'dashboard'} ? ' active'">
            <i class="fa-solid fa-house-medical"></i>
            Dashboard
        </a>

        <a th:href="@{/doctor/myPatient}"
           class="nav-link-item"
           th:classappend="${activePage == 'patients'} ? ' active'">
            <i class="fa-solid fa-user-injured"></i>
            My Patients
        </a>

        <a th:href="@{/assignpatient}"
           class="nav-link-item"
           th:classappend="${activePage == 'assign'} ? ' active'">
            <i class="fa-solid fa-user-plus"></i>
            Assign Patient
        </a>

        <a th:href="@{/patient/list}"
           class="nav-link-item"
           th:classappend="${activePage == 'list'} ? ' active'">
            <i class="fa-solid fa-list"></i>
            List of Assigned Patients
        </a>

        <a th:href="@{/doctor/predictionReview}"
           class="nav-link-item"
           th:classappend="${activePage == 'prediction'} ? ' active'">
            <i class="fa-solid fa-microscope"></i>
            Prediction Review
        </a>

        <a th:href="@{/clinicassistant/appointments}"
           class="nav-link-item"
           th:classappend="${activePage == 'appointments'} ? ' active'">
            <i class="fa-solid fa-calendar-check"></i>
            Appointments
        </a>

        <div class="nav-section-label">Imaging</div>

        <a th:href="@{/radiology}"
           class="nav-link-item"
           th:classappend="${activePage == 'imaging'} ? ' active'">
            <i class="fa-solid fa-x-ray"></i>
            Medical Imaging
        </a>

        <a th:href="@{/reports}"
           class="nav-link-item"
           th:classappend="${activePage == 'reports'} ? ' active'">
            <i class="fa-solid fa-file-medical-alt"></i>
            Report Management
        </a>

        <a th:href="@{/request-scheduling}"
           class="nav-link-item"
           th:classappend="${activePage == 'requestScheduling'} ? ' active'">
            <i class="fa-solid fa-calendar-plus"></i>
            Request &amp; Scheduling
        </a>

        <div class="nav-section-label">Collaboration</div>

        <a th:href="@{/communication}"
           class="nav-link-item"
           th:classappend="${activePage == 'communication'} ? ' active'">
            <i class="fa-solid fa-comments"></i>
            Communication
        </a>

        <div class="nav-section-label">Account</div>

        <a th:href="@{/doctor/updateProfile}"
           class="nav-link-item"
           th:classappend="${activePage == 'editProfile'} ? ' active'">
            <i class="fa-solid fa-user-pen"></i>
            Edit Account
        </a>

    </nav>

    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post" hidden name="logoutForm">
            <input type="submit" value="Logout" />
        </form>
        <a href="javascript: document.logoutForm.submit()" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </a>
    </div>

</aside>

</body>
</html>
